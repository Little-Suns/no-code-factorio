<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>No Code Factorio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* Тёмная терминальная палитра "Factory.exe" (docs/06) */
        --bg: #0e1013; --dirt: #1b1e23; --dirt-dark: #1b1e23;
        --panel-bg: #24272d; --panel-bg-2: #2f343b; --panel-border: #0a0c0e;
        --accent: #f0a030; --accent-dim: #b8791f; --accent-bright: #f5b860;
        --text: #eef1f4; --text-muted: #9aa0a8; --text-dim: #7d838c;
        --ok: #5ecf7a; --error: #e2483f; --idle: #5a5445; --node-icon: #7d8a94;
        --f-disp: 'Press Start 2P', 'IBM Plex Mono', monospace; /* Press Start 2P не знает кириллицу — фоллбэк на Plex Mono */
        --f-body: 'IBM Plex Mono', monospace;
        --f-mono: 'IBM Plex Mono', monospace;
      }
      html, body { margin: 0; overflow: hidden; }
      body { background: var(--bg); color: var(--text); font-family: var(--f-body); }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: var(--dirt); }
      ::-webkit-scrollbar-thumb { background: var(--text-dim); border: 2px solid var(--dirt); }
      @keyframes blinkDot { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
